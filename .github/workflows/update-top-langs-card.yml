name: Update Top Languages Card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate donut top-languages card
        uses: readme-tools/github-readme-stats-action@b4d2ef3b8051484b318d455163153b23a2b35fa2 # v1.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&theme=midnight-purple&langs_count=8&hide_border=true&bg_color=30,2D1B69,4B2E83,6A4C93&title_color=E6D5FF&text_color=F3ECFF
          path: profile/top-langs.svg
          # Set GRS_PAT in repo secrets (classic PAT with repo + read:user) to include private repositories.
          token: ${{ secrets.GRS_PAT != '' && secrets.GRS_PAT || secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain profile/top-langs.svg)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/top-langs.svg
          git commit -m "chore: update top languages card"
          git push
